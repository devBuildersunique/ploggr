name: ploggr
description: "Ploggr — a cleaner planet, one step at a time."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Keep the existing Dart source language. The minimum Flutter toolchain
  # below and the lockfile require Dart 3.13 or newer for dependency resolution.
  sdk: ^3.12.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/illustrations/
    - assets/images/demo/
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans.ttf
          weight: 500
        - asset: assets/fonts/NunitoSans.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans.ttf
          weight: 800
        - asset: assets/fonts/NunitoSans.ttf
          weight: 900
